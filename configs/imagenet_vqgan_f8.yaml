model:
  base_learning_rate: 4.5e-6
  target: taming.models.vqgan.VQModel
  params:
    embed_dim: 256
    n_embed: 1024
    monitor: val/rec_loss
    ddconfig:
      double_z: false
      z_channels: 256
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      # Four resolution levels -> three 2x downsamplings -> f=8.
      # A 256x256 input therefore produces a 32x32 latent/token map.
      ch_mult: [1, 2, 2, 4]
      num_res_blocks: 2
      attn_resolutions: [32]
      dropout: 0.0
    lossconfig:
      target: taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 3
        disc_start: 250001
        disc_weight: 0.8
        codebook_weight: 1.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 8
    train:
      target: taming.data.custom.CustomTrain
      params:
        training_images_list_file: data/imagenet/imagenet_train.txt
        size: 256
        random_crop: true
    validation:
      target: taming.data.custom.CustomTest
      params:
        test_images_list_file: data/imagenet/imagenet_val.txt
        size: 256
        random_crop: false
    test:
      target: taming.data.custom.CustomTest
      params:
        test_images_list_file: data/imagenet/imagenet_val.txt
        size: 256
        random_crop: false

lightning:
  modelcheckpoint:
    target: pytorch_lightning.callbacks.ModelCheckpoint
    params:
      monitor: val/rec_loss
      mode: min
      save_top_k: 3
      save_last: true
      save_weights_only: false
      every_n_epochs: 1
      save_on_train_epoch_end: false
      filename: "best-epoch={epoch:03d}-step={step:09d}-rec={val/rec_loss:.6f}"
      auto_insert_metric_name: false
