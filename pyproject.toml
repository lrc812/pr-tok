[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taming-transformers-larp"
version = "0.1.0"
description = "VQ-GAN training with a LARP-style learned autoregressive latent prior"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "nvidia-nccl-cu12==2.30.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "pytorch-lightning==1.9.5",
  "torchmetrics==0.11.4",
  "omegaconf>=2.3,<3",
  "einops>=0.7,<1",
  "albumentations>=1.4,<2",
  "opencv-python-headless>=4.9,<5",
  "pillow>=10,<12",
  "pandas>=2.1,<3",
  "scikit-image>=0.22,<1",
  "pyyaml>=6,<7",
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
  "transformers==4.28.1",
  "tensorboard>=2.16,<3",
  "more-itertools>=10,<11",
  "imageio>=2.34,<3",
  "setuptools>=68,<81",
  "ftfy>=6.2,<7",
  "beautifulsoup4>=4.12,<5",
  "pytorch-fid>=0.3,<1",
  "accelerate>=0.18,<1",
]

[tool.uv]
package = true
# torch 2.7.1+cu128 pins NCCL 2.26.2, which crashes on multi-GPU RTX 5090.
# NCCL keeps runtime ABI compatibility; 2.30.7 passes the local four-GPU test.
override-dependencies = [
  "nvidia-nccl-cu12==2.30.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = ["pytest>=8,<9"]
